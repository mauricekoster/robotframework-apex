[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "BrowserApex"

[project]
name = "robotframework-apex"

version = "0.0.2"
dependencies = [
    "robotframework >= 7.1.1, < 9.0.0",
    "robotframework-browser >= 20.0.0, < 21.0.0",
    "PyYAML >= 6.0.3",
    "rich >= 15.0.0",
    "typer >= 0.26.8",
    "Jinja2 >= 3.1.6",
    "python-dotenv",
    "parsimonious>=0.11.0",
    "python-oracle-apex>=0.0.1",
]



requires-python = ">= 3.13"
authors = [
    { name = "Maurice Koster", email = "maurice@mauricekoster.com" },
]
description = "Robot Framework Browser extension library supporting Oracle APEX application using Page Object Model."
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
]

[dependency-groups]
dev = ["pytest", "coverage"]

[project.scripts]
rfapex = "BrowserApex.cli.main:main"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
