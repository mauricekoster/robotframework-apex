- # ====== Region: Zittingsregister ============================
  id: 75070230447946311
  identification: 
    name: Zittingsregister
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with naam_desk as (
          select  ltrim(vlet || ' ') || ltrim(vvoeg || ' ') || naam as naam,
                  nrbetr
          from    tdeskundige
      ),
          naam_get as (
          select  ltrim(vlet || ' ') || ltrim(vvoeg || ' ') || naam as naam,
                  nrbetr
          from    toverbetr
      ),
          naam_vert as (
          select  ltrim(vlet || ' ') || ltrim(vvoeg || ' ') || naam as naam,
                  nrbetr
          from    tvertegenw 
      ),
          naam_app as (
          select  ltrim(vlet || ' ') || ltrim(vvoeg || ' ') || naam as naam,
                  nrbetr
          from    tappellant 
      )
      select 
          rzs.ZTG_ID || rzs.vnrcasus || rzs.VNRREG as selectrow,
          rzs.ZTG_ID,
          rzs.vnrcasus,
          ztg.cdpwet || '/' || ztg.nrzitt as zitting,   
          ztg.dtzitt,   
          rzs.vnrreg,
          act.cdrol   as Rol,
          rzs.cdactie,
          rzs.cdactie || ' - ' || act.omschr as Actie,
          rzs.nrbetr,
          case when cdclas = 'U' 
              then 
                  NVL(app.naam, vert.naam)
              when cdrol in ('OGT', 'MGT') 
              then
                  get.naam
              when cdrol in ( 'ODK', 'MDK' )
              then
                  desk.naam
              else
                  null
          end as naam,
          rzs.dtstart as dtstart, 
          rzs.cdprtn  as cdprtn, 
          act.dtaanv  as dtingang_hidden,
          act.dtoph,
          act.cdclas  
        from tregzitcasus rzs
        join tzitting ztg on ztg.ztg_id = rzs.ztg_id
        left join TACTIE act      on (act.cdactie = rzs.cdactie)
        left join naam_desk desk  on (desk.nrbetr = rzs.nrbetr)
        left join naam_get get    on (get.nrbetr = rzs.nrbetr)
        left join naam_vert vert  on (vert.nrbetr = rzs.nrbetr)
        left join naam_app app    on (app.nrbetr = rzs.nrbetr)
        where act.cdsrt = 'ZC'
        and   rzs.vnrreg > 0
        and   rzs.indlogv is null
        and   rzs.vnrcasus = :P1710_VNRCASUS
        order by dtstart desc, vnrreg desc;
    page-items-to-submit: 
    - P1710_VNRCASUS

  layout: 
    sequence: 160
    parent-region: Tabs container # 40635083116144835
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    css-classes: 
    - focusable_region
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-side-condition: 
    type: Item is NOT NULL
    item: P1710_VNRBSLT

