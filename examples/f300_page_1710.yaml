- # ====== Region: Zittingen ===================================
  id: 107748910419343078
  identification: 
    name: Zittingen
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select  rze.ztg_id
          ,   ztg.cdpwet || '/' || ztg.nrzitt as zitting
          ,   ztg.dtzitt
          ,   rze.nrrol
          ,   pce.vnrcasus
          ,   rze.pce_id
          ,   pce.cdpwet
          ,   pce.jaar
          ,   pce.vnrproc
          ,   pce.cdpwet || to_char(pce.jaar,'00') || '/' || pce.vnrproc as zaaknummer
          ,   pce.cdarrond
          ,   rbt.cdreggvng
          ,   pce.nrbetrfpr
          ,   pce.nrbetrgrf
          ,   case when fts1.nrbetr is not null then
                  '<b>V: </b>' || ltrim(fts1.cdbetr || ' - ','- ') || ltrim(ttl1.omschr || ' ') || ltrim(fts1.vlet || ' ') || ltrim(fts1.vvoeg || ' ') || fts1.naam || rtrim(' ' || ttl2.omschr)
              end || '<br>' ||
              case when fts2.nrbetr is not null then
                  '<b>G: </b>' || ltrim(fts2.cdbetr || ' - ','- ') || ltrim(ttl3.omschr || ' ') || ltrim(fts2.vlet || ' ') || ltrim(fts2.vvoeg || ' ') || fts2.naam || rtrim(' ' || ttl4.omschr)
              end as functionaris
          ,   pce.cdcatproc
          ,   to_char(to_date(rze.aanvzitpr,'sssss'),'hh24:mi') || rtrim(' (' || ltrim(rze.behandeltijd || ' min)',' min)'),' (') as aanvzitpr
          ,   rze.behandeltijd
          ,   cst1.omschr || case when rze.cdannulpoz is null then null when rze.cdannulpoz = 'ANDERS' then '<br>' || rze.redenanders else '<br>' || cst2.omschr end as cdvrdging
          ,   pbe.nrbetr as nrcor
          ,   ltrim(apt1.vlet || ' ') || ltrim(apt1.vvoeg || ' ') || apt1.naam as cor
          ,   bbe.nrbetr as nrvwr
          ,   ltrim(apt2.vlet || ' ') || ltrim(apt2.vvoeg || ' ') || apt2.naam as vwr
          ,   '<b>COR:</b> ' || ltrim(apt1.vlet || ' ') || ltrim(apt1.vvoeg || ' ') || apt1.naam || '<br><b>VWR:</b> ' || ltrim(apt2.vlet || ' ') || ltrim(apt2.vvoeg || ' ') || apt2.naam as partijen
          ,   rze.indopenb
          ,   rze.indrdkmr
          ,   rze.pce_id as delete_row
      from    tregzitproc rze
      join    tproc pce on pce.pce_id = rze.pce_id
      join    tzitting ztg on ztg.ztg_id = rze.ztg_id
      left join tregelbslt rbt on rbt.vnrbslt = pce.vnrbslt and rbt.vnrregbslt = 1
      left join tfunctionaris fts1 on fts1.nrbetr = pce.nrbetrfpr
      left join tfunctionaris fts2 on fts2.nrbetr = pce.nrbetrgrf
      left join tprocbelang pbe on pbe.pce_id = pce.pce_id and pbe.cdsrt = 'COR' and pbe.regelnummer = 1
      left join tbsltbetro bbe on bbe.vnrbslt = pce.vnrbslt and bbe.cdsrt = 'VWR'
      left join tappellant apt1 on apt1.nrbetr = pbe.nrbetr
      left join tappellant apt2 on apt2.nrbetr = bbe.nrbetr
      left join ttit ttl1 on ttl1.cdtit = fts1.cdtit and ttl1.cdgesl = fts1.cdgesl
      left join ttit ttl2 on ttl2.cdtit = fts1.cdatit and ttl2.cdgesl = fts1.cdgesl
      left join ttit ttl3 on ttl3.cdtit = fts2.cdtit and ttl3.cdgesl = fts2.cdgesl
      left join ttit ttl4 on ttl4.cdtit = fts2.cdatit and ttl4.cdgesl = fts2.cdgesl
      left join tcatsrt cst1 on cst1.cdsrt = rze.cdvrdging and cst1.cdcat = 'CDZITT'
      left join tcatsrt cst2 on cst2.cdsrt = rze.cdannulpoz and cst2.cdcat = 'ANNPOZ'
      where   rze.vnrreg = 0
      and     pce.vnrcasus = :P1710_VNRCASUS
      order by ztg.dtzitt desc
          ,   nrzitt desc
          ,   rze.aanvzitpr
          ,   to_number(rtrim(lower(nrrol),'abcdefghijklmnopqrstuvwxyz') default 9999 on conversion error)
          ,   rze.nrrol
    page-items-to-submit: 
    - P1710_VNRCASUS

