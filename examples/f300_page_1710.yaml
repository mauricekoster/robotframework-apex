- # ====== Region: Register ====================================
  id: 74943163484257916
  identification: 
    name: Register
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select rcs.vnrcasus
      ,      rcs.vnrreg
      ,      rcs.cdactie
      ,      rcs.nrbetr 
      ,      dke.cdbetr
      ,      case when rcs.nrbetr is not null then dke.cdbetr end as inddesk
      ,      rcs.dtstart
      ,      ate.termrapactie as termijn
      ,      rcs.termverl
      ,      case when ate.termrapactie is not null or rcs.termverl is not null then rcs.dtstart + nvl(ate.termrapactie, 0) + nvl(rcs.termverl, 0) end as dteind
      ,      case when rcs.dtcompl is not null then rcs.dtcompl || '<br><em>' || rcs.gewijzigd_door || '</em>' end as dtcompl
      ,      rcs.cdcompl as cdcompl
      ,      ate.omschr  as omschrijving
      ,      rcs.idgebr   
      from   tregcasus    rcs
      left join  tdeskundige dke on (dke.nrbetr = rcs.nrbetr)
      left join  tactie ate on (ate.cdactie = rcs.cdactie and ate.cdsrt = rcs.cdsrt)
      left join tdocregcas drs on (rcs.vnrcasus = drs.vnrcasus and rcs.vnrreg = drs.vnrreg)
      left join tdocaanvraag dag on (dag.idfile = drs.idfile)
      where  rcs.vnrcasus = :P1710_VNRCASUS
      and    rcs.indlogv is null 
      order by rcs.dtcompl desc, rcs.dtstart desc, rcs.vnrreg desc
    page-items-to-submit: 
    - P1710_VNRCASUS

