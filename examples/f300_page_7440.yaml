- # ====== Dynamic Action: Key down (key_next or key_previous) -
  id: 74984788595450041
  identification: 
    name: Key down (key_next or key_previous) - Switch item

  execution: 
    sequence: 50
    event-scope: Static
    type: Immediate

  when: 
    event: Key Down
    selection-type: jQuery Selector
    jquery-selector: body

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: this.browserEvent.which === region.key_previous || this.browserEvent.which === region.key_next

