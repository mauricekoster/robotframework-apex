- # ====== Dynamic Action: Change P7440- Verander aantal rijen =
  id: 74988830891450043
  identification: 
    name: Change P7440- Verander aantal rijen

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P7440_VNR_ZK
    - P7440_OMSCHR_ZK
    - P7440_CATEGORIE_ZK
    - P7440_JAAR_ZK

  actions: 
  - # ====== Action: Set Value ===================================
    id: 74989330887450043
    identification: 
      action: Set Value

    settings: 
      set-type: SQL Statement
      sql-statement: |
        SELECT COUNT(*) FROM 
            (select sbt.vnrbedgrfrcht
            , sbt.cdpwet
            , sbt.bedgrfrcht
            , sbt.omschr as sbt_omschr 
        from TSTANDBEDGRFRCHT sbt -- landelijke tabel in berber_common
        where (:P7440_VNR_ZK is null or sbt.VNRBEDGRFRCHT like :P7440_VNR_ZK)
        and   (:P7440_OMSCHR_ZK is null or sbt.omschr like :P7440_OMSCHR_ZK collate binary_ai)
        and   (:P7440_CATEGORIE_ZK is null or sbt.categorie = :P7440_CATEGORIE_ZK)
        and   (:P7440_JAAR_ZK is null or to_char(sbt.dtaanvang, 'YYYY') like :P7440_JAAR_ZK)
            order by sbt.vnrbedgrfrcht desc)
      items-to-submit: 
      - P7440_VNR_ZK
      - P7440_OMSCHR_ZK
      - P7440_CATEGORIE_ZK
      - P7440_JAAR_ZK
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - P7440_AANTAL_RIJEN

    execution: 
      sequence: 10
      event: Change P7440- Verander aantal rijen # 74988830891450043
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

