    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select 
        sbt.cdpwet
      , sbt.vnrbedgrfrcht
      , sbt.categorie 
      , sbt.bedgrfrcht
      , sbt.omschr
      , sbt.dtaanvang
      , sbt.dteind
      from TSTANDBEDGRFRCHT sbt -- landelijke tabel in berber_common
      where (:P7440_VNR_ZK is null or sbt.VNRBEDGRFRCHT like :P7440_VNR_ZK)
      and   (:P7440_OMSCHR_ZK is null or sbt.omschr like :P7440_OMSCHR_ZK collate binary_ai)
      and   (:P7440_CATEGORIE_ZK is null or sbt.categorie = :P7440_CATEGORIE_ZK)
      and   (:P7440_JAAR_ZK is null or to_char(sbt.dtaanvang, 'YYYY') like :P7440_JAAR_ZK)
      order by sbt.dtaanvang desc, sbt.categorie asc
