- # ====== Region: Partijgegevens &P1020_ZAAKNUMMER. ===========
  id: 4645883660271607
  identification: 
    name: Partijgegevens &P1020_ZAAKNUMMER.
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select  hpe.volgnr
          ,   case hpe.regelnummer
                  when 1 then hpe.cdsrt
                  when 2 then 'WVT'
              end as cdsrt
          ,   hpe.regelnummer as regelnummer
          ,   hpe.nrbetr as nrbetr_pbe
          ,   case hpe.regelnummer
                  when 1 then hpe.nrbetr
                  when 2 then hpe.nrbetrwvt
              end as nrbetr
          ,   case hpe.regelnummer
                  when 1 then ltrim(apt.vlet || ' ') || ltrim(apt.vvoeg || ' ') || apt.naam
                  when 2 then ltrim(vtr.vlet || ' ') || ltrim(vtr.vvoeg || ' ') || vtr.naam
              end as naam
          ,   case
                  when hpe.regelnummer = 1 and apt.indsrtpers = 'N' then 'P'
                  when hpe.regelnummer = 1 and apt.indsrtpers = 'R' then 'I'
                  when hpe.regelnummer = 2 then 'WVT'
              end as functie
          ,   coalesce(tpb.nrbetrgem,hpe.nrbetrgem) as nrbetrgem
          ,   coalesce(tpb.nrbetrgem,hpe.nrbetrgem) as naamgem
          ,   coalesce(tpb.kenmgem,hpe.kenmgem) as kenmgem
          ,   hpe.kenmerk
          ,   hpe.nmcontactpers
          ,   hpe.volgnr || '.' || hpe.nrbetr || '.' || hpe.regelnummer as hpe_pk
          ,   hpe.nrbetr || '.' || hpe.regelnummer as delete_row
          ,   case hpe.cdsrt
                  when 'COR' then 1
                  when 'APP' then 2
                  else 3
              end as volgorde
      from    thulpprocbelang hpe
      left join tappellant apt on apt.nrbetr = hpe.nrbetr
      left join tvertegenw vtr on vtr.nrbetr = hpe.nrbetrwvt
      left join tprocbelang tpb on tpb.pce_id = :P1020_PCE_ID
      where   volgnr = :APP_SESSION
      order by volgorde, nrbetr_pbe, hpe.regelnummer
    page-items-to-submit: 
    - P1020_NRBETR

