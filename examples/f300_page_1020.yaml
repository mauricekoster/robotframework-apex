- # ====== Region: Partijen ====================================
  id: 5472727971137823
  identification: 
    name: Partijen
    type: Form

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with adres as (
          select  nrbetr
              ,   geheimadr
              ,   cdsrt
              ,   row_number() over (partition by nrbetr order by cdsrt) as volgnummer
              ,   locadr
              ,   ltrim(strnm || ' ') || ltrim(hnr || ' ') || ltrim(toevhnr || ' ') || ltrim(pcn || ' ') || ltrim(pca || ' ') || ltrim(pcbl || ' ') || ltrim(plaats || ' ') || land as adres
              ,   strnm
              ,   hnr
              ,   hlet
              ,   toevhnr
              ,   pcn
              ,   pca
              ,   plaats
              ,   pcbl
              ,   gem
              ,   land
              ,   teladr
              ,   toestel
              ,   nrtelmobiel
              ,   nrfax
              ,   emailadres
              ,   emailadres2
          from    tadres
      )
      select  hpe.volgnr || '.' || hpe.nrbetr || '.' || hpe.regelnummer as hpe_pk
          ,   hpe.volgnr
          ,   case
                  when hpe.regelnummer = 1 then
                      hpe.nrbetr
                  when hpe.regelnummer = 2 then
                      hpe.nrbetrwvt
              end as nrbetr
          ,   hpe.regelnummer
          ,   case 
                  when apt.indsrtpers = 'N' then
                      apt.nrbetr
                  else  
                      null
              end as nrbetr_p
          ,   hpe.cdsrt
          ,   case 
                  when apt.indsrtpers = 'N' then
                      hpe.cdsrt
                  else  
                      null
              end as cdsrt_p
          ,   hpe.naam
          ,   hpe.dtinsert
          ,   hpe.indnw
          ,   hpe.naamgem
          ,   hpe.nrbetrgem
          ,   hpe.kenmgem
          ,   hpe.kenmerk
          ,   case 
                  when apt.indsrtpers = 'N' then
                      hpe.kenmerk
                  else  
                      null
              end as kenmerk_p
          ,   case 
                  when apt.indsrtpers = 'N' then
                      hpe.kenmerk
                  else  
                      null
              end as kenmerk_i
         ,    case
                  when apt.indsrtpers = 'R' and (cst2.cdhoed not in ('BO','REA') or cst2.cdhoed is null) and hpe.nmcontactpers is not null then
                      hpe.nmcontactpers
                  when apt.indsrtpers = 'R' and (cst2.cdhoed not in ('BO','REA') or cst2.cdhoed is null) and apt.nmcontactpers is not null then 
                      apt.nmcontactpers 
                  else 
                      null
                  end as nmcontactpers
          ,   apt.indsrtpers
          ,   case 
                  when hpe.regelnummer = 2 then
                      'WVT'
                  when apt.indsrtpers = 'N' then
                      'P'
                  when apt.indsrtpers = 'R' and (cst2.cdhoed not in ('BO','REA') or cst2.cdhoed is null) then
                      'I'
                  else  
                      null
              end as functie
          ,   apt.bsn
          ,   case 
                  when apt.indsrtpers = 'N' then
                      apt.naam
                  else  
                      null
              end as naam_p
          ,   apt.vvoeg
          ,   apt.vnam
          ,   apt.vlet
          ,   apt.cdgesl
          ,   apt.dtgeb
          ,   apt.cdtit
          ,   apt.cdatit
          ,   apt.indmjar
          ,   apt.indovl
          ,   apt.indwv
          ,   apt.nmechtg
          ,   apt.vvoegechtg
          ,   apt.cdsrtdesk
          ,   apt.nrref
          ,   apt.nrcrv   
          ,   apt.inddet
          ,   apt.idlandher
          ,   apt.idnat  
          ,   apt.lnnaam as lnnaam_p
          ,   apt.alias  
          ,   case 
                  when apt.indsrtpers = 'R' then
                      hpe.cdsrt
                  else  
                      null
              end as cdsrt_i
          ,   case 
                  when apt.indsrtpers = 'R' then
                      apt.nrbetr
                  else  
                      null
              end as nrbetr_i
          ,   case 
                  when apt.indsrtpers = 'R' then
                      apt.lnnaam
                  else  
                      null
              end as lnnaam_i
          ,   case 
                  when apt.indsrtpers = 'R' then
                      apt.naam
                  else  
                      null
              end as naam_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.cdsrtrpers
                  else
                      null
              end as cdsrtrpers_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.cdbetr
                  else
                      null
              end as cdbetr_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.cdbetr
                  else
                      null
              end as cdbetr_display_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.indactf
                  else
                  null
              end as indactf_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.plstatv
                  else
                  null
              end as plstatv_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.oin
                  else
                  null
              end as oin_i
          ,   case
                  when apt.indsrtpers = 'R'  then
                      apt.nrbetrgem
                  else
                      null
              end as nrbetrgem_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.nmcontactpers
                  else
                      null
              end as nmcontactpers_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.debiteurnr
                  else
                      null
                  end as debiteurnr_i
          ,   case
                  when apt.indsrtpers = 'R' then
                      apt.rcstatus
                  else
                      null
              end as rcstatus_i
          ,   vtr2.cdsrt as cdsrt_wvt
          ,   case 
                  when hpe.regelnummer = 2 then
                      hpe.nrbetr 
                  else 
                      null
              end as nrbetr_pbe_wvt
          ,   hpe.nrbetrwvt as nrbetr_wvt
          ,   hpe.nrbetr as nrbetr_wvt_old
          ,   hpe.kenmerk as kenmerk_wvt
          ,   vtr2.naam as naam_wvt
          ,   vtr2.vvoeg as vvoeg_wvt
          ,   vtr2.cdgesl as cdgesl_wvt
          ,   vtr2.vlet as vlet_wvt
          ,   vtr2.cdtit as cdtit_wvt
          ,   vtr2.cdatit as cdatit_wvt
          ,   vtr2.opm as opm_wvt
          ,   coalesce(ads_c.cdsrt,ads_t.cdsrt,ads_w.cdsrt) as actief_adres
          ,   ads_c.cdsrt as cdsrt_c
          ,   ads_c.locadr as locadr_c
          ,   ads_c.strnm as strnm_c
          ,   ads_c.hnr as hnr_c
          ,   ads_c.toevhnr as toevhnr_c
          ,   ads_c.hlet as hlet_c
          ,   ads_c.pcn as pcn_c
          ,   ads_c.pca as pca_c
          ,   ads_c.plaats as plaats_c
          ,   ads_c.gem as gem_c
          ,   ads_c.land as land_c
          ,   ads_c.teladr as teladr_c
          ,   ads_c.toestel as toestel_c
          ,   ads_c.nrtelmobiel as nrtelmobiel_c
          ,   ads_c.nrfax as nrfax_c
          ,   ads_c.emailadres as emailadres_c
          ,   ads_c.emailadres2 as emailadres2_c
          ,   ads_c.pcbl as pcbl_c
          ,   ads_t.cdsrt as cdsrt_t
          ,   ads_t.geheimadr as geheimadr_t
          ,   ads_t.locadr as locadr_t
          ,   ads_t.strnm as strnm_t
          ,   ads_t.hnr as hnr_t
          ,   ads_t.toevhnr as toevhnr_t
          ,   ads_t.hlet as hlet_t
          ,   ads_t.pcn as pcn_t
          ,   ads_t.pca as pca_t
          ,   ads_t.plaats as plaats_t
          ,   ads_t.gem as gem_t
          ,   ads_t.land as land_t
          ,   ads_t.teladr as teladr_t
          ,   ads_t.toestel as toestel_t
          ,   ads_t.nrtelmobiel as nrtelmobiel_t
          ,   ads_t.nrfax as nrfax_t
          ,   ads_t.emailadres as emailadres_t
          ,   ads_t.emailadres2 as emailadres2_t
          ,   ads_t.pcbl as pcbl_t
          ,   ads_t.inonderz as inonderz_t
          ,   ads_w.cdsrt as cdsrt_w
          ,   ads_w.locadr as locadr_w
          ,   ads_w.strnm as strnm_w
          ,   ads_w.hnr as hnr_w
          ,   ads_w.toevhnr as toevhnr_w
          ,   ads_w.hlet as hlet_w
          ,   ads_w.pcn as pcn_w
          ,   ads_w.pca as pca_w
          ,   ads_w.plaats as plaats_w
          ,   ads_w.gem as gem_w
          ,   ads_w.land as land_w
          ,   ads_w.teladr as teladr_w
          ,   ads_w.toestel as toestel_w
          ,   ads_w.nrtelmobiel as nrtelmobiel_w
          ,   ads_w.nrfax as nrfax_w
          ,   ads_w.emailadres as emailadres_w
          ,   ads_w.emailadres2 as emailadres2_w
          ,   ads_w.pcbl as pcbl_w
          ,   vtr.naam as vtr_naam
          ,   vtr.indactf as vtr_indactf
          ,   vtr.cdbetr as vtr_cdbetr
          ,   vtr.nrbetradvkant as vtr_nrbetradvkant
          ,   vtr.cdbar  as vtr_cdbar
          ,   ads_g.cdsrt as cdsrt_g
          ,   cst1.omschr as soort_adres_g
          ,   ads_g.locadr as locadr_g
          ,   ads_g.adres as adres_g
          ,   ads_g.strnm as strnm_g
          ,   ads_g.hnr as hnr_g
          ,   ads_g.hlet as hlet_g
          ,   ads_g.toevhnr as toevhnr_g
          ,   ads_g.pcn as pcn_g
          ,   ads_g.pca as pca_g
          ,   ads_g.plaats as plaats_g
          ,   ads_g.pcbl as pcbl_g
          ,   ads_g.gem as gem_g
          ,   ads_g.land as land_g
          ,   ads_g.teladr as teladr_g
          ,   ads_g.toestel as toestel_g
          ,   ads_g.nrtelmobiel as nrtelmobiel_g
          ,   ads_g.nrfax as nrfax_g
          ,   ads_g.emailadres as emailadres_g
          ,   ads_g.emailadres2 as emailadres2_g
      from    thulpprocbelang hpe
      left join tappellant apt on apt.nrbetr = hpe.nrbetr and hpe.regelnummer = 1
      left join tvertegenw vtr on vtr.nrbetr = hpe.nrbetrgem
      left join tvertegenw vtr2 on vtr2.nrbetr = hpe.nrbetrwvt and hpe.regelnummer = 2
      left join tadres ads_c on ((ads_c.nrbetr = apt.nrbetr and hpe.regelnummer = 1) or (ads_c.nrbetr = vtr2.nrbetr and hpe.regelnummer = 2)) and ads_c.cdsrt = 'C'
      left join tadres ads_t on ((ads_t.nrbetr = apt.nrbetr and hpe.regelnummer = 1) or (ads_t.nrbetr = vtr2.nrbetr and hpe.regelnummer = 2)) and ads_t.cdsrt = 'T'
      left join tadres ads_w on ((ads_w.nrbetr = apt.nrbetr and hpe.regelnummer = 1) or (ads_w.nrbetr = vtr2.nrbetr and hpe.regelnummer = 2)) and ads_w.cdsrt = 'W'
      left join adres ads_g on ads_g.nrbetr = nvl(vtr.nrbetradvkant,hpe.nrbetrgem) and ads_g.volgnummer = 1
      left join tcatsrt cst1 on cst1.cdsrt = ads_g.cdsrt and cst1.cdcat = 'ADRES' and cst1.cdsrt in ('C','T','W')
      left join tcatsrt cst2 on cst2.cdsrt = apt.cdsrtrpers and cst2.cdcat = 'RPERS'

