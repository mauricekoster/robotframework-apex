- # ====== Dynamic Action: Get focus - set TAB_SELECTED ========
  id: 49014032718541829
  identification: 
    name: Get focus - set TAB_SELECTED

  execution: 
    sequence: 700
    event-scope: Static
    type: Immediate

  when: 
    event: Get Focus
    selection-type: Region
    region: Partijen # 5472727971137823

  server-side-condition: 
    type: Never

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 49014178152541830
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        function getSelectedTabId() {
         const tabIds = ["SR_tab_persoon", "SR_tab_instantie", "SR_tab_wettelijk_vertegenwoordiger"];
         
         let actives = document.getElementsByClassName('a-Tabs-element-selected'); 
         for (let i = 0; i < actives.length; i++) {
          if (tabIds.includes(actives[i].id)) return actives[i].id;
         }
         
         return null;
        }
        
        $s("P1020_TAB_SELECTED", getSelectedTabId());

    execution: 
      sequence: 10
      event: Get focus - set TAB_SELECTED # 49014032718541829
      fire-when-event-result-is: True
      fire-on-initialization: false

