- # ====== Region: Zaken =======================================
  id: 119956386949252333
  identification: 
    name: Zaken
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select  pce.pce_id
          ,   pce.cdpwet  || to_char(pce.jaar,'00') || '/' || pce.vnrproc as zaaknummer
          ,   pce.cdarrond
          ,   pce.cdsrtproc
          ,   pce.dtontvbrp
          ,   pce.cdafd
          ,   bst.dtbslt
          ,   pss.cdstat
          ,   pss.indafgedaan
          ,   pbe.nrbetr as cor
          ,   rbt.cdreggvng
          ,   pde.cddoslokatie
          ,   case 
                  when pce.cdarrond != :P0_CDARROND_USER then
                      'glasses'
                  else
                      'pencil'
              end as html_icon
          ,   case 
                  when pce.cdarrond != :P0_CDARROND_USER then
                      'Raadplegen'
                  else
                      'Bewerken'
              end as html_title
      from    tproc pce
      left join tbesluit bst on bst.vnrbslt = pce.vnrbslt
      left join tregelbslt rbt on rbt.vnrbslt = pce.vnrbslt and rbt.vnrregbslt = 1
      left join tbsltbetro bbe on pce.vnrbslt = bbe.vnrbslt and bbe.cdsrt = 'VWR'
      left join tprocbelang pbe on pbe.pce_id = pce.pce_id and pbe.cdsrt = 'COR' and pbe.regelnummer = 1
      left join (   select  ps.pce_id
                        ,   ps.cdstat
                        ,   case when sre.cdsrt in ('b','n','u5','v','vb','x') then 'N' else 'J' end as indafgedaan
                    from    vwprocstat ps
                    join    tstatproc sre on (ps.cdpwet = sre.cdpwet and ps.cdstat = sre.cdstat)
                    where ps.vnrstat = (SELECT max(ps2.vnrstat) vnrstat
                                        from tprocstat ps2
                                        where ps2.pce_id = ps.pce_id
                                       )
                  ) pss on pss.pce_id = pce.pce_id
      left join ( select  pd.pce_id,
                          pd.cddoslokatie
                  from tprocdos pd
                  where pd.vnruitleen = (select max(pd2.vnruitleen)
                                         from tprocdos pd2
                                         where pd2.pce_id = pd.pce_id
                                        )
                ) pde on pde.pce_id = pce.pce_id
      where   bst.vnrbslt = :P1250_VNRBSLT
      order by to_date(pce.jaar, 'RR') desc, vnrproc desc;
    page-items-to-submit: 
    - P1250_VNRBSLT

