- # ====== Region: &P1250_REGION_NAME. =========================
  id: 51299443222994210
  identification: 
    name: '&P1250_REGION_NAME.'
    type: Form

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with bbe as
          (  select bbe.nrbetr
             ,      bbe.vnrbslt
             from   tbsltbetro bbe
             where  bbe.cdsrt   = 'VWR'
          )
      , rbt as 
          ( select 
                   rbt.vnrbslt
            ,      rbt.cdsrtreggvng
            ,      rbt.cdsrtreggvng||' - '||srg.omschr as omssrtreggvng
            ,      rbt.cdpwet    
            from   tregelbslt rbt
            ,      tsrtreggvng srg
            where  srg.cdpwet       = rbt.cdpwet
            and    srg.cdsrtreggvng = rbt.cdsrtreggvng
            and  rbt.vnrregbslt     = 1
          )  
      , rgg as 
          ( select rbt.vnrbslt
            ,      rgg.cdpwet
            ,      rgg.cdsrtreggvng
            ,      rbt.cdreggvng
            ,      rbt.cdreggvng||' - '||rgg.omschr as omsreggvng
            from   tregelbslt rbt
            ,      tregel     rgg
            where  rgg.cdreggvng    = rbt.cdreggvng
            and    rbt.vnrregbslt   = 1
            and    rbt.cdsrtreggvng = rgg.cdsrtreggvng
           )
      select bst.vnrbslt
      ,      rbt.cdsrtreggvng
      ,      rbt.omssrtreggvng
      ,      rgg.cdreggvng
      ,      rgg.omsreggvng 
      ,      NVL(bst.kenm, '<geen kenmerk>') AS kenm
      ,      bst.vnrcasus as vnrcasus_bslt
      ,      bst.cdsrt as cdsrt_bst
      ,      decode ( bst.cdsrt, 'AU', ' Rechtbank', 'AU_OUD', ' Rechtbank', 'Verweerder' ) as vwr_rea
      ,      bst.dtbslt
      ,      bst.dtverzuitr
      ,      bst.dtpbslt
      ,      bst.dtasiel
      ,      bst.jraansl
      ,      bst.dtbeginaansl
      ,      bst.dteindaansl
      ,      bst.nraansl
      ,      bst.cdsrtaansl
      ,      bst.indboete
      ,      bst.dtredtermijn
      ,      bst.objbslt
      ,      bst.loc
      ,      bst.ondbslt
      ,      bst.strekbslt 
      ,      bbe.nrbetr
      ,     (select count(*)
             from   tvolgbesluit vbt
             where  vbt.vnrbslt = :P1250_VNRBSLT     
            )  as aantal_vbt
      from   tbesluit bst 
      left join bbe on bst.vnrbslt = bbe.vnrbslt
      left join rbt on bst.vnrbslt = rbt.vnrbslt
      left join rgg on ('AWB'= rgg.cdpwet and bst.vnrbslt = rgg.vnrbslt and rgg.cdsrtreggvng = rbt.cdsrtreggvng)
      
    page-items-to-submit: 
    - P1250_VNRBSLT

  layout: 
    sequence: 49
    parent-region: Container # 51373962285006965
