- # ====== Region: Besluitpartijen =============================
  id: 46278956172830534
  identification: 
    name: Besluitpartijen
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select  bst.vnrbslt 
            , bbe.nrbetr
          ,   ltrim(apt.vlet || ' ') || ltrim(apt.vvoeg || ' ') || coalesce(apt.lnnaam,apt.naam) as naam
          ,   null as regelnummer
          ,   bbe.cdsrt
          ,   bbe.nrbetrgem
          ,   case bbe.cdsrt
                  when 'VWR' then 2
                  when 'VGH' then 4
                  when 'BES' then 6
              end as volgorde
          ,   'BBE' as soort_partij
      from   tbesluit bst
      join   tbsltbetro bbe on bst.vnrbslt = bbe.vnrbslt
      join    tappellant apt on apt.nrbetr = bbe.nrbetr
      where  bst.vnrbslt = :P1250_VNRBSLT
      order by volgorde, nrbetr, regelnummer;
    page-items-to-submit: 
    - P1250_VNRBSLT

